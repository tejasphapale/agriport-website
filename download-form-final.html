<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriPort - Download APK</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin: 0 auto 20px;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.05rem;
            opacity: 0.95;
        }

        /* Form */
        .form-container {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .required::after {
            content: ' *';
            color: #ff6b6b;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .error-message {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9rem;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #dcfce7;
            border: 1px solid #86efac;
            color: #166534;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9rem;
        }

        .success-message.show {
            display: block;
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-reset {
            background: #f5f5f5;
            color: #333;
            border: 1px solid #ddd;
        }

        .btn-reset:hover {
            background: #efefef;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .link-section {
            text-align: center;
            padding: 20px 30px;
            border-top: 1px solid #f0f0f0;
            background: #f9f9f9;
        }

        .link-section p {
            margin-bottom: 10px;
            color: #666;
        }

        .link-section a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .link-section a:hover {
            color: #764ba2;
        }

        .footer {
            text-align: center;
            padding: 20px;
            background: #f9f9f9;
            color: #999;
            font-size: 0.85rem;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .form-container {
                padding: 25px 20px;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">🌾</div>
            <h1>AgriPort</h1>
            <p>Download Agricultural Management App</p>
        </div>

        <!-- Form -->
        <div class="form-container">
            <div class="error-message" id="errorMsg"></div>
            <div class="success-message" id="successMsg"></div>

            <form id="downloadForm" onsubmit="handleSubmit(event)">
                <!-- Name -->
                <div class="form-group">
                    <label class="required">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name" required>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label class="required">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <!-- Phone & City -->
                <div class="form-row">
                    <div class="form-group">
                        <label class="required">Mobile Number</label>
                        <input type="tel" id="phone" placeholder="10-digit number" maxlength="10" required>
                    </div>
                    <div class="form-group">
                        <label class="required">City</label>
                        <input type="text" id="city" placeholder="Your city" required>
                    </div>
                </div>

                <!-- State & Occupation -->
                <div class="form-row">
                    <div class="form-group">
                        <label class="required">State</label>
                        <input type="text" id="state" placeholder="Your state" required>
                    </div>
                    <div class="form-group">
                        <label class="required">Occupation</label>
                        <select id="occupation" required>
                            <option value="">Select occupation</option>
                            <option value="Farmer">🌾 Farmer</option>
                            <option value="Trader">🏪 Trader</option>
                            <option value="Transport">🚛 Transport</option>
                            <option value="Other">📌 Other</option>
                        </select>
                    </div>
                </div>

                <!-- Farm Name & Experience -->
                <div class="form-row">
                    <div class="form-group">
                        <label>Farm/Business Name</label>
                        <input type="text" id="farmName" placeholder="Your farm or business name">
                    </div>
                    <div class="form-group">
                        <label>Experience Level</label>
                        <select id="experience">
                            <option value="">Select level</option>
                            <option value="Beginner">🌱 Beginner</option>
                            <option value="Intermediate">🌿 Intermediate</option>
                            <option value="Experienced">🌳 Experienced</option>
                        </select>
                    </div>
                </div>

                <!-- Message -->
                <div class="form-group">
                    <label>Message (Optional)</label>
                    <textarea id="message" rows="3" placeholder="Any message or feedback..."></textarea>
                </div>

                <!-- Buttons -->
                <div class="button-group">
                    <button type="submit" class="btn btn-submit">
                        <span id="btnText">📥 Download APK</span>
                    </button>
                    <button type="reset" class="btn btn-reset">Clear Form</button>
                </div>
            </form>
        </div>

        <!-- Links -->
        <div class="link-section">
            <p>Already downloaded? <a href="admin-dashboard-final.html">View Dashboard →</a></p>
        </div>

        <!-- Footer -->
        <div class="footer">
            AgriPort © 2026 | Agricultural Management Platform
        </div>
    </div>

    <script src="store-download.js"></script>
    <script>
        function handleSubmit(event) {
            event.preventDefault()

            // Get form values
            const formData = {
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                city: document.getElementById('city').value.trim(),
                state: document.getElementById('state').value.trim(),
                occupation: document.getElementById('occupation').value,
                farmName: document.getElementById('farmName').value.trim(),
                experience: document.getElementById('experience').value,
                message: document.getElementById('message').value.trim()
            }

            // Validate
            if (!formData.name || !formData.email || !formData.phone || !formData.city || !formData.state || !formData.occupation) {
                showError('Please fill all required fields!')
                return
            }

            // Validate phone
            if (!/^\d{10}$/.test(formData.phone)) {
                showError('Phone must be 10 digits!')
                return
            }

            // Validate email
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(formData.email)) {
                showError('Please enter a valid email!')
                return
            }

            // Show loading state
            const btn = event.target.querySelector('button[type="submit"]')
            const btnText = document.getElementById('btnText')
            btn.disabled = true
            btnText.innerHTML = '<span class="spinner"></span> Processing...'

            // Save to store
            try {
                const record = downloadStore.add(formData)
                if (record) {
                    showSuccess('✅ Form submitted successfully! Downloading APK...')
                    setTimeout(() => {
                        downloadAPK()
                        setTimeout(() => {
                            document.getElementById('downloadForm').reset()
                            btn.disabled = false
                            btnText.innerHTML = '📥 Download APK'
                        }, 1000)
                    }, 1500)
                } else {
                    throw new Error('Failed to save form')
                }
            } catch (e) {
                showError('Error saving form: ' + e.message)
                btn.disabled = false
                btnText.innerHTML = '📥 Download APK'
            }
        }

        function downloadAPK() {
            const link = document.createElement('a')
            link.href = 'uploads/agriport-latest.apk'
            link.download = 'agriport-latest.apk'
            document.body.appendChild(link)
            link.click()
            document.body.removeChild(link)
        }

        function showError(msg) {
            const errorDiv = document.getElementById('errorMsg')
            errorDiv.textContent = msg
            errorDiv.classList.add('show')
            setTimeout(() => {
                errorDiv.classList.remove('show')
            }, 5000)
        }

        function showSuccess(msg) {
            const successDiv = document.getElementById('successMsg')
            successDiv.textContent = msg
            successDiv.classList.add('show')
            setTimeout(() => {
                successDiv.classList.remove('show')
            }, 5000)
        }

        // Phone number formatting
        document.getElementById('phone').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '').slice(0, 10)
        })
    </script>
</body>
</html>
