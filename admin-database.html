<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriPort Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2e7d32;
            --primary-dark: #1b5e20;
            --primary-light: #4caf50;
            --danger: #f44336;
            --warning: #ff9800;
            --success: #4caf50;
            --info: #2196f3;
            --gray-50: #fafafa;
            --gray-100: #f5f5f5;
            --gray-200: #eeeeee;
            --gray-300: #e0e0e0;
            --gray-600: #757575;
            --gray-800: #424242;
            --gray-900: #212121;
            --white: #ffffff;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.12);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.15);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.18);
            --shadow-xl: 0 12px 32px rgba(0,0,0,0.2);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: var(--gray-900);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* ============ HEADER ============ */
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--white);
            padding: 1.5rem 2rem;
            box-shadow: var(--shadow-lg);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 1.8rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn-header {
            background: rgba(255,255,255,0.2);
            color: var(--white);
            border: 1px solid rgba(255,255,255,0.3);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-header:hover {
            background: rgba(255,255,255,0.3);
            border-color: rgba(255,255,255,0.5);
        }

        /* ============ CONTAINER ============ */
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* ============ STATS GRID ============ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--white);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            border-left: 5px solid var(--primary);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .stat-label {
            font-size: 0.95rem;
            color: var(--gray-600);
        }

        .stat-change {
            font-size: 0.85rem;
            margin-top: 0.5rem;
            padding: 0.4rem 0.8rem;
            background: #e8f5e9;
            color: var(--primary);
            border-radius: 4px;
            display: inline-block;
        }

        /* ============ FILTERS & ACTIONS ============ */
        .controls {
            background: var(--white);
            padding: 1.5rem;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.8rem 1.2rem;
            border: 2px solid var(--gray-200);
            border-radius: 10px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
        }

        .search-box i {
            position: absolute;
            right: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-600);
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--white);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-secondary {
            background: var(--gray-200);
            color: var(--gray-900);
        }

        .btn-secondary:hover {
            background: var(--gray-300);
        }

        .btn-danger {
            background: #ffebee;
            color: var(--danger);
        }

        .btn-danger:hover {
            background: #ffcdd2;
        }

        .btn-sm {
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
        }

        /* ============ TABLE ============ */
        .table-container {
            background: var(--white);
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        thead {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--white);
        }

        th {
            padding: 1.2rem;
            text-align: left;
            font-weight: 600;
        }

        td {
            padding: 1.2rem;
            border-bottom: 1px solid var(--gray-200);
        }

        tbody tr:hover {
            background: var(--gray-50);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .user-name {
            font-weight: 600;
            color: var(--gray-900);
        }

        .user-email {
            font-size: 0.85rem;
            color: var(--gray-600);
        }

        .status-badge {
            display: inline-block;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-active {
            background: #e8f5e9;
            color: var(--success);
        }

        .status-blocked {
            background: #ffebee;
            color: var(--danger);
        }

        .actions-cell {
            display: flex;
            gap: 0.5rem;
        }

        .action-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn-view {
            background: #e3f2fd;
            color: var(--info);
        }

        .action-btn-view:hover {
            background: #bbdefb;
        }

        .action-btn-delete {
            background: #ffebee;
            color: var(--danger);
        }

        .action-btn-delete:hover {
            background: #ffcdd2;
        }

        .action-btn-block {
            background: #fff3e0;
            color: var(--warning);
        }

        .action-btn-block:hover {
            background: #ffe0b2;
        }

        /* ============ NO DATA ============ */
        .no-data {
            text-align: center;
            padding: 3rem;
            color: var(--gray-600);
        }

        .no-data-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* ============ MODAL ============ */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--white);
            border-radius: 16px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--white);
            padding: 2rem;
            border-radius: 16px 16px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 1.5rem;
            font-weight: 800;
        }

        .close-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: var(--white);
            font-size: 1.5rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .modal-body {
            padding: 2rem;
        }

        .detail-row {
            margin-bottom: 1.5rem;
        }

        .detail-label {
            font-size: 0.85rem;
            color: var(--gray-600);
            font-weight: 600;
            margin-bottom: 0.4rem;
        }

        .detail-value {
            font-size: 0.95rem;
            color: var(--gray-900);
            background: var(--gray-50);
            padding: 0.8rem;
            border-radius: 8px;
            word-break: break-all;
        }

        .modal-footer {
            padding: 2rem;
            border-top: 1px solid var(--gray-200);
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            .search-box {
                min-width: 100%;
            }

            .table-wrapper {
                font-size: 0.8rem;
            }

            th, td {
                padding: 0.8rem;
            }

            .actions-cell {
                flex-direction: column;
            }

            .action-btn {
                width: 28px;
                height: 28px;
                font-size: 0.8rem;
            }
        }

        /* ============ ALERTS ============ */
        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        .alert.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-success {
            background: #e8f5e9;
            color: var(--success);
            border-left: 4px solid var(--success);
        }

        .alert-danger {
            background: #ffebee;
            color: var(--danger);
            border-left: 4px solid var(--danger);
        }

        .alert-info {
            background: #e3f2fd;
            color: var(--info);
            border-left: 4px solid var(--info);
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="header-content">
            <div class="header-title">
                <i class="fas fa-chart-line"></i>
                AgriPort Admin Dashboard
            </div>
            <div class="header-actions">
                <button class="btn-header" onclick="exportData()">
                    <i class="fas fa-download"></i> Export CSV
                </button>
                <button class="btn-header" onclick="exportJSON()">
                    <i class="fas fa-file-export"></i> Export JSON
                </button>
                <button class="btn-header" onclick="confirmClearAll()">
                    <i class="fas fa-trash"></i> Clear All
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="container">
        <!-- ALERTS -->
        <div id="alertBox"></div>

        <!-- STATS -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-value" id="totalUsers">0</div>
                <div class="stat-label">Total Downloads</div>
                <div class="stat-change">↑ Updated live</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-value" id="activeUsers">0</div>
                <div class="stat-label">Active Users</div>
                <div class="stat-change">Can access app</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🚫</div>
                <div class="stat-value" id="blockedUsers">0</div>
                <div class="stat-label">Blocked Users</div>
                <div class="stat-change">No access</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📱</div>
                <div class="stat-value" id="todayCount">0</div>
                <div class="stat-label">Downloads Today</div>
                <div class="stat-change">This 24 hours</div>
            </div>
        </div>

        <!-- CONTROLS -->
        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by name, email, or phone..." onkeyup="filterTable()">
                <i class="fas fa-search"></i>
            </div>
            <button class="btn btn-secondary" onclick="resetSearch()">
                <i class="fas fa-redo"></i> Reset
            </button>
            <button class="btn btn-primary" onclick="location.reload()">
                <i class="fas fa-sync"></i> Refresh
            </button>
        </div>

        <!-- TABLE -->
        <div class="table-container">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>City, State</th>
                            <th>Occupation</th>
                            <th>Status</th>
                            <th>Downloaded</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="9" class="no-data">
                                <div class="no-data-icon">📊</div>
                                <p>No download records found yet</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- DETAIL MODAL -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>User Details</h2>
                <button class="close-btn" onclick="closeModal('detailModal')">&times;</button>
            </div>
            <div class="modal-body" id="detailBody"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('detailModal')">Close</button>
            </div>
        </div>
    </div>

    <!-- CONFIRM MODAL -->
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Confirm Action</h2>
                <button class="close-btn" onclick="closeModal('confirmModal')">&times;</button>
            </div>
            <div class="modal-body">
                <p id="confirmMessage" style="font-size: 1rem; color: var(--gray-800);"></p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('confirmModal')">Cancel</button>
                <button class="btn btn-danger" id="confirmBtn" onclick="">Delete</button>
            </div>
        </div>
    </div>

    <script>
        let allData = [];
        let blockedUsers = [];

        function loadData() {
            // Show loading state
            document.getElementById('loadingState').style.display = 'block';
            document.getElementById('dataTable').style.display = 'none';
            document.getElementById('emptyState').style.display = 'none';

            // Load from localStorage (works across all devices and browsers)
            try {
                const saved = localStorage.getItem('agriport_downloads');
                if (saved) {
                    allData = JSON.parse(saved);
                    const savedBlocked = localStorage.getItem('agriport_blocked_users');
                    blockedUsers = savedBlocked ? JSON.parse(savedBlocked) : [];
                    console.log('✅ Loaded ' + allData.length + ' records from storage');
                } else {
                    console.log('⚠️ No data found in storage');
                    allData = [];
                    blockedUsers = [];
                }
            } catch (e) {
                console.log('⚠️ Error loading data:', e);
                allData = [];
                blockedUsers = [];
            }
            
            document.getElementById('loadingState').style.display = 'none';
            renderTable();
            updateStats();
        }

        function isUserBlocked(userId) {
            return blockedUsers.includes(userId);
        }

        function updateStats() {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

            const todayCount = allData.filter(d => new Date(d.timestamp) >= today).length;
            const activeCount = allData.length - blockedUsers.length;
            const blockedCount = blockedUsers.length;

            document.getElementById('totalUsers').textContent = allData.length;
            document.getElementById('activeUsers').textContent = activeCount;
            document.getElementById('blockedUsers').textContent = blockedCount;
            document.getElementById('todayCount').textContent = todayCount;
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');

            if (allData.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" class="no-data">
                            <div class="no-data-icon">📊</div>
                            <p>No download records found yet</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = allData.map((record, index) => {
                const isBlocked = isUserBlocked(record.id);
                const status = isBlocked ? 'Blocked' : 'Active';
                const statusClass = isBlocked ? 'status-blocked' : 'status-active';

                return `
                    <tr>
                        <td>${index + 1}</td>
                        <td>
                            <div class="user-info">
                                <span class="user-name">${record.name}</span>
                                <span class="user-email">${record.email}</span>
                            </div>
                        </td>
                        <td>${record.email}</td>
                        <td>${record.phone}</td>
                        <td>${record.city}, ${record.state}</td>
                        <td>${record.occupation}</td>
                        <td><span class="status-badge ${statusClass}">${status}</span></td>
                        <td>${new Date(record.timestamp).toLocaleDateString()}</td>
                        <td>
                            <div class="actions-cell">
                                <button class="action-btn action-btn-view" onclick="viewDetails(${index})" title="View Details">
                                    <i class="fas fa-eye"></i>
                                </button>
                                <button class="action-btn ${isBlocked ? 'action-btn-view' : 'action-btn-block'}" 
                                    onclick="toggleBlockUser(${index})" 
                                    title="${isBlocked ? 'Unblock User' : 'Block User'}">
                                    <i class="fas ${isBlocked ? 'fa-check-circle' : 'fa-ban'}"></i>
                                </button>
                                <button class="action-btn action-btn-delete" onclick="deleteUser(${index})" title="Delete">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function viewDetails(index) {
            const record = allData[index];
            const detailBody = document.getElementById('detailBody');

            detailBody.innerHTML = `
                <div class="detail-row">
                    <div class="detail-label">Full Name</div>
                    <div class="detail-value">${record.name}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Email Address</div>
                    <div class="detail-value">${record.email}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Phone Number</div>
                    <div class="detail-value">${record.phone}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">City</div>
                    <div class="detail-value">${record.city}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">State</div>
                    <div class="detail-value">${record.state}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Occupation</div>
                    <div class="detail-value">${record.occupation}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Farm/Business Name</div>
                    <div class="detail-value">${record.farmName || 'N/A'}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Experience Level</div>
                    <div class="detail-value">${record.experience || 'Not specified'}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Message</div>
                    <div class="detail-value">${record.message || 'No message'}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Downloaded On</div>
                    <div class="detail-value">${new Date(record.timestamp).toLocaleString()}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Status</div>
                    <div class="detail-value">${isUserBlocked(record.id) ? '🚫 Blocked' : '✅ Active'}</div>
                </div>
            `;

            document.getElementById('detailModal').classList.add('active');
        }

        function toggleBlockUser(index) {
            const record = allData[index];
            const isBlocked = isUserBlocked(record.id);

            const action = isBlocked ? 'unblock' : 'block';
            
            fetch(`api.php?action=${action}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: record.id })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    if (isBlocked) {
                        blockedUsers = blockedUsers.filter(id => id !== record.id);
                        showAlert(`✅ ${record.name} has been unblocked`, 'success');
                    } else {
                        blockedUsers.push(record.id);
                        showAlert(`🚫 ${record.name} has been blocked - No access to app`, 'info');
                    }
                    saveBlocedUsers();
                    renderTable();
                    updateStats();
                }
            })
            .catch(err => {
                // Fallback to localStorage
                if (isBlocked) {
                    blockedUsers = blockedUsers.filter(id => id !== record.id);
                    showAlert(`✅ ${record.name} has been unblocked`, 'success');
                } else {
                    blockedUsers.push(record.id);
                    showAlert(`🚫 ${record.name} has been blocked - No access to app`, 'info');
                }
                saveBlocedUsers();
                renderTable();
                updateStats();
            });
        }

        function deleteUser(index) {
            const record = allData[index];
            document.getElementById('confirmMessage').textContent = `Are you sure you want to delete ${record.name}'s record? This cannot be undone.`;
            document.getElementById('confirmBtn').onclick = () => {
                fetch('api.php?action=delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: record.id })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        allData.splice(index, 1);
                        blockedUsers = blockedUsers.filter(id => id !== record.id);
                        saveBlocedUsers();
                        renderTable();
                        updateStats();
                        closeModal('confirmModal');
                        showAlert(`✅ ${record.name}'s record has been deleted`, 'success');
                    }
                })
                .catch(err => {
                    // Fallback to localStorage
                    allData.splice(index, 1);
                    blockedUsers = blockedUsers.filter(id => id !== record.id);
                    saveBlocedUsers();
                    renderTable();
                    updateStats();
                    closeModal('confirmModal');
                    showAlert(`✅ ${record.name}'s record has been deleted`, 'success');
                });
            };
            document.getElementById('confirmModal').classList.add('active');
        }

        function filterTable() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('#tableBody tr');

            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(searchTerm) ? '' : 'none';
            });
        }

        function resetSearch() {
            document.getElementById('searchInput').value = '';
            filterTable();
        }

        function exportData() {
            if (allData.length === 0) {
                showAlert('No data to export', 'info');
                return;
            }

            let csv = 'Name,Email,Phone,City,State,Occupation,Experience,Farm Name,Message,Downloaded,Status\n';
            allData.forEach(record => {
                const status = isUserBlocked(record.id) ? 'Blocked' : 'Active';
                csv += `"${record.name}","${record.email}","${record.phone}","${record.city}","${record.state}","${record.occupation}","${record.experience || ''}","${record.farmName || ''}","${(record.message || '').replace(/"/g, '""')}","${new Date(record.timestamp).toLocaleString()}","${status}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `agriport-users-${new Date().toISOString().split('T')[0]}.csv`;
            link.click();

            showAlert('✅ Data exported as CSV', 'success');
        }

        function exportJSON() {
            if (allData.length === 0) {
                showAlert('No data to export', 'info');
                return;
            }

            const dataToExport = allData.map(record => ({
                ...record,
                status: isUserBlocked(record.id) ? 'Blocked' : 'Active'
            }));

            const json = JSON.stringify(dataToExport, null, 2);
            const blob = new Blob([json], { type: 'application/json;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `agriport-users-${new Date().toISOString().split('T')[0]}.json`;
            link.click();

            showAlert('✅ Data exported as JSON', 'success');
        }

        function confirmClearAll() {
            document.getElementById('confirmMessage').textContent = 'Are you sure you want to delete ALL records? This cannot be undone.';
            document.getElementById('confirmBtn').textContent = 'Delete All';
            document.getElementById('confirmBtn').onclick = () => {
                fetch('api.php?action=clear', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        allData = [];
                        blockedUsers = [];
                        saveBlocedUsers();
                        renderTable();
                        updateStats();
                        closeModal('confirmModal');
                        showAlert('✅ All records have been cleared', 'success');
                    }
                })
                .catch(err => {
                    allData = [];
                    blockedUsers = [];
                    saveBlocedUsers();
                    renderTable();
                    updateStats();
                    closeModal('confirmModal');
                    showAlert('✅ All records have been cleared', 'success');
                });
            };
            document.getElementById('confirmModal').classList.add('active');
        }

        function saveData() {
            localStorage.setItem('agriport_downloads', JSON.stringify(allData));
        }

        function saveBlocedUsers() {
            localStorage.setItem('agriport_blocked_users', JSON.stringify(blockedUsers));
        }

        function showAlert(message, type = 'success') {
            const alertBox = document.getElementById('alertBox');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type} show`;
            alert.textContent = message;
            alertBox.innerHTML = '';
            alertBox.appendChild(alert);

            setTimeout(() => alert.classList.remove('show'), 3000);
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        window.onclick = function(event) {
            const detailModal = document.getElementById('detailModal');
            const confirmModal = document.getElementById('confirmModal');
            if (event.target === detailModal) closeModal('detailModal');
            if (event.target === confirmModal) closeModal('confirmModal');
        };

        // Initial load
        loadData();

        // Refresh every 5 seconds
        setInterval(loadData, 5000);
    </script>
    <script src="sync-manager.js"></script>
</body>
</html>
